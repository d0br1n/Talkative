name: ios
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - name: Test TalkativeCore on Darwin
        run: swift test
        working-directory: ios/TalkativeCore
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            ios/build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - run: ios/scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Talkative.ipa
          path: ios/build/Talkative.ipa
          retention-days: 7
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: Talkative.ipa
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          marketing="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' ios/project.yml | head -1)"
          if [ "$version" != "$marketing" ]; then
            echo "tag $GITHUB_REF_NAME does not match MARKETING_VERSION $marketing in ios/project.yml" >&2
            exit 1
          fi
          bun scripts/sidestore-source.ts --version "$version" --ipa dist/Talkative.ipa --out dist/source.json
          gh release create "$GITHUB_REF_NAME" dist/Talkative.ipa dist/source.json \
            --title "Talkative $version" --generate-notes
