[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talkative-bench"
version = "0.1.0"
description = "Benchmarks for choosing self-hosted speech engines for Talkative"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
