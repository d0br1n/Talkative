[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talkative-bench"
version = "0.1.0"
description = "Benchmarks for choosing self-hosted speech engines for Talkative"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.32.0",
    "sherpa-onnx==1.13.8",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
